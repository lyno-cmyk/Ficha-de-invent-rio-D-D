<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">

<title>Ficha de inventário</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--red:#58180d;--ink:#2b2118;--bg:#e8dcc0;--pg:#f4ecd6;--z:#ebe0c0;--ln:#c9b787;color-scheme:light}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 "Bookman Old Style","Palatino Linotype",Georgia,serif}
.pg{max-width:1040px;margin:14px auto 40px;padding:22px 26px;background:var(--pg);border:1px solid var(--ln);box-shadow:0 0 0 5px var(--pg),0 0 0 6px var(--ln);transition:margin .2s}
@media(min-width:1100px){body.po .pg{margin-left:400px}}
@media(max-width:1210px){.pg{margin-right:84px}}
@media(max-width:700px){.pg{margin:8px 64px 30px 8px;padding:12px}}
h1{margin:0 0 12px;font-variant:small-caps;font-size:32px;color:var(--red);border-bottom:3px solid var(--red)}
h2{margin:18px 0 6px;font-variant:small-caps;font-size:22px;color:var(--red);border-bottom:1px solid var(--red);display:flex;align-items:center;gap:10px}
h2 button{margin-left:auto}
.top{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center}.f{display:grid;gap:8px}
label{font-size:11px;color:#4a3b2a;display:block}
input{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--ln);padding:1px 4px;width:100%;min-width:0}
input:focus,select:focus{outline:0;background:#fbf6e6;border-bottom-color:var(--red)}
select{font:inherit;color:var(--ink);background:#fbf6e6;border:0;border-bottom:1px solid var(--ln);padding:4px 6px;width:100%;min-width:0;font-size:15px}
.f input{font-size:15px;background:#fbf6e6;padding:4px 6px}
.ca{width:110px;text-align:center;border:3px solid var(--red);border-radius:6px 6px 50% 50%;padding:6px 4px 14px;background:#fbf6e6}.ca small{display:block;font-size:11px;color:var(--red);font-weight:bold}.ca b{font-size:38px;line-height:1;color:var(--red)}.ca i{display:block;font-size:9px;color:#4a3b2a;margin-top:4px}
button{font:inherit;font-size:12px;border:1px solid var(--red);background:var(--pg);color:var(--red);cursor:pointer;padding:2px 9px;border-radius:3px}button:hover{background:var(--red);color:var(--pg)}
.tbl{overflow-x:auto}.tbl>*{min-width:760px}
.main{display:grid;grid-template-columns:24px 54px 1.1fr 2fr 80px 84px 56px 22px 22px;gap:4px;align-items:center}
.hd{font-size:11px;font-weight:bold;color:var(--red);padding:4px 8px;border-bottom:2px solid var(--red)}
.it{padding:2px 8px;border-left:4px solid #8a7a5a}.it:nth-child(even){background:var(--z)}.it.w{border-left-color:#8b1e1e}.it.a{border-left-color:#1f4e79}.it.z{opacity:.5}.it.dg{opacity:.3}
.q{text-align:center}.cn{display:flex;gap:3px}.cn button{width:24px;padding:0;font-size:14px;line-height:1.2}.x{padding:0;width:24px;border-color:transparent;color:#8a6f4a}
.grip{cursor:grab;touch-action:none;user-select:none;color:#8a6f4a;font-size:17px;text-align:center}
.sub{display:flex;gap:10px;flex-wrap:wrap;margin:3px 0 0 30px;font-size:11px}.sub label{width:110px}.sub label.w{flex:1;min-width:180px}.sub .ck{display:flex;align-items:center;gap:5px;width:auto;align-self:flex-end}.sub .ck input{width:auto}
.lst{min-height:46px}.lst:not(:has(.it))::after{content:attr(data-h);display:block;padding:12px;font-style:italic;color:#8a6f4a;text-align:center;border:2px dashed var(--ln);margin-top:6px}
.eq{background:#fbf6e6;border:1px solid var(--ln)}.eq:not(:has(.it))::after{border:0}

.weight-panel{margin:10px 0 14px;padding:10px 12px;background:#fbf6e6;border:1px solid var(--ln);border-left:5px solid #8a7a5a}
.weight-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.weight-head b{color:var(--red);font-variant:small-caps;font-size:16px}
.weight-values{display:flex;gap:18px;flex-wrap:wrap;margin:5px 0;font-size:12px}
.weight-values strong{font-size:15px}
.weight-track{height:9px;background:#e2d4ac;border:1px solid var(--ln);border-radius:8px;overflow:hidden;margin:6px 0}
.weight-fill{height:100%;width:0;background:#6b7c45;transition:width .2s}
.weight-note{font-size:11px;color:#4a3b2a}
.weight-panel.over{border-left-color:#8b1e1e}.weight-panel.over .weight-fill{background:#a52b20}
.weight-panel.over .weight-status{color:#8b1e1e;font-weight:bold}
.ph{height:4px;background:var(--red);margin:1px 0}.ghost{position:fixed;z-index:90;pointer-events:none;background:var(--red);color:var(--pg);padding:4px 12px;border-radius:14px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#sd{position:fixed;right:0;top:50%;transform:translateY(-50%);max-height:100vh;overflow-y:auto;z-index:40;display:flex;flex-direction:column;gap:6px;padding:8px 6px;background:var(--pg);border:2px solid var(--red);border-right:0;border-radius:10px 0 0 10px}
#sd button{width:64px;padding:6px 2px;font-size:11px;line-height:1.2}#sd button span{display:block;font-size:22px}#sd button.on{background:var(--red);color:var(--pg)}

#pn.on{transform:none}#pn h3{margin:0 0 6px;color:var(--red);font-variant:small-caps;font-size:20px;display:flex;justify-content:space-between}

#cl{overflow:auto;flex:1}.cr{display:flex;gap:6px;align-items:center;padding:4px 6px;cursor:pointer;border-bottom:1px solid #ddd0aa}.cr:nth-child(even){background:var(--z)}.cr.sel{background:#e6c96a!important;outline:2px solid var(--red);outline-offset:-2px}
.cr b.n{flex:1}.cr .m{font-size:11px;color:#4a3b2a;text-align:right}.gh{padding:4px 6px;font-size:11px;font-style:italic;color:var(--red);background:#e2d4ac;position:sticky;top:0}
.main{font-size:13px;line-height:1.2}.main input{font-size:13px;padding:0 4px}.it ::placeholder{font-size:9px;opacity:.65}
.it.m{border-left-color:#4a6b3a}.it:not(.o) .ex{display:none}.ex{padding:1px 0 3px}
.dc{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12px;color:#4a3b2a;cursor:pointer;min-width:0}.dc:empty::before{content:"Descrição";font-size:9px;opacity:.65}
.tg{padding:0;width:22px;border-color:transparent;color:#8a6f4a;transition:transform .15s}.it.o .tg{transform:rotate(180deg)}
.dd{display:block;margin:2px 0 0 28px;font-size:11px}.dd textarea{font:inherit;font-size:12px;width:100%;min-height:42px;resize:vertical;border:1px solid var(--ln);background:#fbf6e6;color:var(--ink);padding:3px 5px}
#ts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--red);color:var(--pg);padding:8px 16px;border-radius:6px;z-index:120;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}#ts.on{opacity:1}
@media(max-width:700px){.top{grid-template-columns:1fr}}
.two{display:grid;grid-template-columns:1fr 72px;gap:6px}.it.mg{outline:2px dashed var(--red);outline-offset:-2px;background:#e6c96a!important}

<main class="pg">
<h1>Ficha de inventário</h1>
<header class="top"><div class="f">
<label>Nome<input data-i="nome"></label><label>Classe<input data-i="classe"></label></div>
<div class="ca"><small>CA ATUAL</small><b id="ca">10</b><i id="cad"></i></div>
<div class="f"><label>Subclasse<input data-i="sub"></label><label>Raça<input data-i="raca"></label><label>Atributo da CA (modificador)<span class="two"><select data-i="atr"><option value="des">Destreza</option><option value="for">Força</option><option value="con">Constituição</option><option value="int">Inteligência</option><option value="sab">Sabedoria</option><option value="car">Carisma</option><option value="out">Outro</option></select><input type="number" id="mod" value="0" aria-label="Modificador"></span></label><label>Força<input type="number" min="1" max="30" data-i="forca"></label><label>Categoria de tamanho<select data-i="tamanho"><option>Miúdo</option><option>Pequeno</option><option selected>Médio</option><option>Grande</option><option>Enorme</option><option>Imenso</option></select></label></div>
</header>
<section><h2>Equipado</h2><div class="tbl"><div class="lst eq" data-l="eq" data-h="Arraste itens do inventário para cá (a primeira armadura define a CA)"></div></div></section>
<section class="weight-panel" id="weightPanel"><div class="weight-head"><b>Peso carregado</b><span class="weight-status" id="weightStatus">Informe sua Força para calcular a capacidade.</span></div><div class="weight-values"><span>Carregado: <strong id="weightTotal">0 kg</strong></span><span>Capacidade máxima: <strong id="weightMax">—</strong></span><span>Disponível: <strong id="weightFree">—</strong></span></div><div class="weight-track"><div class="weight-fill" id="weightFill"></div></div><div class="weight-note" id="weightNote">O cálculo considera inventário e equipamento, multiplicados pelas respectivas quantidades; itens equipados contam metade do peso.</div></section>
<section><h2>Inventário <button id="nw">+ Novo item</button></h2><div class="tbl"><div class="lst" data-l="inv" data-h="Abra Armas, Armaduras ou Itens gerais no menu à direita e arraste itens para cá"></div></div></section>
</main>
<aside id="sd"><button data-c="w"><span>⚔️</span>Armas</button><button data-c="a"><span>🛡️</span>Armaduras</button><button data-c="g"><span>🎒</span>Itens gerais</button><button data-c="m"><span>🏹</span>Munições</button><button data-c="fa"><span>🔮</span>Focos arcanos</button><button data-c="fd"><span>🌿</span>Focos druídicos</button></aside>
<aside id="pn"><h3><span id="pt"></span><button id="px">✕</button></h3><div class="bar"><input id="sq" placeholder="Buscar…"><button id="ad">Adicionar selecionados</button></div><div id="cl"></div></aside>

const KEY='ficha-inventario-v1',$=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={nome:'',classe:'',sub:'',raca:'',des:0,forca:10,tamanho:'Médio',inv:[],eq:[]};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
S.mods=Object.assign({des:+S.des||0,for:0,con:0,int:0,sab:0,car:0,out:0},S.mods);S.atr=S.atr||'des';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const find=id=>{for(const l of['inv','eq']){const i=S[l].findIndex(x=>x.id==id);if(i>=0)return{l,i,it:S[l][i]}}};
function mk(c){const b={id:uid(),k:c.c,key:c.c+c.n,n:c.n,d:c.d||'',p:c.p,v:c.v,q:1};
 if(c.c=='w')Object.assign(b,{dm:c.dm,at:'',ma:c.ma,pr:c.pr});
 if(c.c=='m')Object.assign(b,{ar:c.ar,q:+c.qt,d:'Pacote de '+c.qt+' · armazenamento: '+c.ar});
 if(c.c=='a')Object.assign(b,{ca:c.ca,md:c.md,fu:c.fu});return b}
const inp=(f,v,x='')=>`<input data-f="${f}" value="${esc(v)}" ${x}>`;
function row(i){const x=i.k=='w'?`<div class="sub"><label>Dano de ataque${inp('dm',i.dm)}</label><label>Ataque${inp('at',i.at,'placeholder="+0"')}</label><label>Maestria${inp('ma',i.ma)}</label><label class="w">Propriedades${inp('pr',i.pr)}</label></div>`
 :i.k=='a'?`<div class="sub"><label>CA${inp('ca',i.ca)}</label><label>Limite do bônus de Des${inp('md',i.md,'placeholder="sem limite"')}</label><label class="ck"><input type="checkbox" data-f="fu" ${i.fu?'checked':''}>Desvantagem em Furtividade</label></div>`:i.k=='m'?`<div class="sub"><label class="w">Armazenamento necessário (precisa estar equipado)${inp('ar',i.ar)}</label></div>`:'';
 return `<div class="it ${i.k}${i.q==0?' z':''}${i.o?' o':''}" data-id="${i.id}" data-key="${esc(i.key)}"><div class="main"><b class="grip" title="Arraste">⠿</b><input type="number" min="0" class="q" data-f="q" value="${i.q}" placeholder="Qtd">${inp('n',i.n,'placeholder="Nome"')}<span class="dc" data-a="t" title="Expandir">${esc(i.d)}</span>${inp('p',i.p,'placeholder="Peso"')}${inp('v',i.v,'placeholder="Valor"')}<span class="cn"><button data-a="-" title="Diminuir">−</button><button data-a="+" title="Aumentar">+</button></span><button class="tg" data-a="t" title="Expandir ou recolher">▾</button><button class="x" data-a="x" title="Excluir">✕</button></div><div class="ex"><label class="dd">Descrição<textarea data-f="d" placeholder="Descrição completa">${esc(i.d)}</textarea></label>${x}</div></div>`}
function chk(){const m=[];S.eq=S.eq.filter(i=>{if(need(i)){S.inv.push(i);m.push(i.n);return false}return true});if(m.length)toast('Sem o armazenamento equipado: '+m.join(', ')+' voltou ao inventário')}
function render(){chk();document.querySelectorAll('.lst').forEach(l=>l.innerHTML=S[l.dataset.l].map(row).join(''));calc()}
function calc(){const d=+S.mods[S.atr]||0,ab={des:'Des',for:'For',con:'Con',int:'Int',sab:'Sab',car:'Car',out:'Mod'}[S.atr]||'Mod',a=S.eq.find(i=>i.k=='a'&&!/^\+/.test(i.ca)),s=S.eq.find(i=>i.k=='a'&&/^\+/.test(i.ca));let base=10,dx=d,t='10 + Des';
 if(a){base=parseInt(a.ca)||10;const m=a.md===''||a.md==null?NaN:+a.md;if(!isNaN(m))dx=m===0?0:Math.min(d,m);t=a.n+' '+base+' + '+ab+' '+dx}else t='Sem armadura: 10 + '+ab+' '+d;
 const b=s?parseInt(s.ca)||0:0;if(s)t+=' + '+s.n+' '+b;$('#ca').textContent=base+dx+b;$('#cad').textContent=t;calcWeight()}
function weightKg(raw){
 const v=String(raw??'').trim().toLowerCase();
 if(!v||v==='—'||v==='-'||v==='varia')return 0;
 const m=v.match(/-?\d+(?:[.,]\d+)?/);if(!m)return 0;
 const n=parseFloat(m[0].replace(',','.'));
 if(/\bg\b|gramas?/.test(v))return n/1000;
 return n;
}
function fmtKg(n){return n.toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:2})+' kg'}
function calcWeight(){
 const wt=(a,m)=>a.reduce((sum,i)=>sum+weightKg(i.p)*Math.max(0,+i.q||0),0)*m,total=wt(S.inv,1)+wt(S.eq,.5);
 const str=Math.max(0,+S.forca||0),sizes={'Miúdo':0.5,'Pequeno':1,'Médio':1,'Grande':2,'Enorme':4,'Imenso':8};
 const mult=sizes[S.tamanho]||1,max=str>0?str*15*0.45359237*mult:0;
 const panel=$('#weightPanel'),fill=$('#weightFill'),status=$('#weightStatus');
 $('#weightTotal').textContent=fmtKg(total);$('#weightMax').textContent=max?fmtKg(max):'—';$('#weightFree').textContent=max?fmtKg(max-total):'—';
 fill.style.width=Math.min(100,max?total/max*100:0)+'%';panel.classList.toggle('over',!!max&&total>max);
 if(!str){status.textContent='Informe sua Força para calcular a capacidade.';$('#weightNote').textContent='O peso carregado soma inventário e equipamento (itens equipados contam metade do peso). Pesos em gramas e quilogramas são convertidos automaticamente.'}
 else if(total>max){status.textContent='Capacidade excedida';$('#weightNote').textContent='Você está carregando '+fmtKg(total-max)+' acima da sua capacidade de carga.'}
 else{status.textContent='Dentro da capacidade';$('#weightNote').textContent='Força '+str+' · '+S.tamanho+' · multiplicador de tamanho ×'+mult+'. Itens equipados contam metade do peso.'}
}

document.querySelectorAll('[data-i]').forEach(e=>{e.value=S[e.dataset.i]??e.value;e.oninput=()=>{S[e.dataset.i]=e.type=='number'?+e.value||0:e.value;calc();save()};e.onchange=()=>{S[e.dataset.i]=e.type=='number'?+e.value||0:e.value;calc();save()}});
const mod=$('#mod'),atr=$('[data-i="atr"]'),sync=()=>{mod.value=S.mods[S.atr]??0};sync();
atr.addEventListener('change',()=>{S.atr=atr.value;sync();calc();save()});mod.oninput=()=>{S.mods[S.atr]=+mod.value||0;calc();save()};
document.addEventListener('input',e=>{const f=e.target.dataset.f,r=e.target.closest('.it');if(!f||!r)return;const o=find(r.dataset.id);if(!o)return;
 o.it[f]=e.target.type=='checkbox'?e.target.checked:f=='q'?Math.max(0,+e.target.value||0):e.target.value;if(f=='q')r.classList.toggle('z',o.it.q==0);if(f=='d')r.querySelector('.dc').textContent=e.target.value;calc();save()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const r=b.closest('.it'),o=find(r.dataset.id),a=b.dataset.a;
 if(a=='t'){o.it.o=!o.it.o;r.classList.toggle('o',!!o.it.o);save();return}
 if(a=='x'){if(!b.dataset.t){b.dataset.t=1;b.textContent='?';setTimeout(()=>{delete b.dataset.t;b.textContent='✕'},2500);return}S[o.l].splice(o.i,1);render();save();return}
 o.it.q=Math.max(0,o.it.q+(a=='+'?1:-1));const q=r.querySelector('.q');q.value=o.it.q;r.classList.toggle('z',o.it.q==0);calc();save()});
$('#nw').onclick=()=>{S.inv.push({id:uid(),k:'g',key:'',n:'',d:'',p:'',v:'',q:1,o:true});render();save()};
/* painel de catalogo */
let cc=null,cl=[],selc=new Set();
function list(){const q=$('#sq').value.toLowerCase();let h='',g='';cl.forEach((c,k)=>{if(q&&!c.n.toLowerCase().includes(q))return;if(c.g&&c.g!=g){g=c.g;h+=`<div class="gh">${g}</div>`}
 const m=c.c=='w'?c.dm+' · '+c.p+' · '+c.v:c.c=='a'?'CA '+c.ca+' · '+c.p+' · '+c.v:c.c=='m'?c.qt+' un. · '+c.ar+' · '+c.p+' · '+c.v:c.p+' · '+c.v;h+=`<div class="cr${selc.has(k)?' sel':''}" data-k="${k}"><b class="grip" title="Arraste">⠿</b><b class="n">${esc(c.n)}</b><span class="m">${esc(m)}</span></div>`});$('#cl').innerHTML=h}
function open(c){if(cc==c){cc=null}else{cc=c;cl=CAT[c];selc.clear();$('#pt').textContent=TT[c];$('#sq').value=''}
 $('#pn').classList.toggle('on',!!cc);document.body.classList.toggle('po',!!cc);document.querySelectorAll('#sd button').forEach(b=>b.classList.toggle('on',b.dataset.c==cc));if(cc)list()}
document.querySelectorAll('#sd button').forEach(b=>b.onclick=()=>open(b.dataset.c));$('#px').onclick=()=>open(cc);$('#sq').oninput=list;
$('#cl').addEventListener('click',e=>{const r=e.target.closest('.cr');if(!r||e.target.closest('.grip'))return;const k=+r.dataset.k;selc.has(k)?selc.delete(k):selc.add(k);r.classList.toggle('sel')});
function put(ks,l,at,mg,auto){const arr=S[l];ks.forEach(k=>{const n=mk(cl[k]);if(l=='eq'&&need(n))return toast('Equipe antes: '+n.ar);const ex=mg?arr.find(x=>x.id==mg):auto?arr.find(x=>x.key==n.key):null;if(ex)ex.q+=n.q;else arr.splice(at++,0,n)});selc.clear();list();render();save()}
$('#ad').onclick=()=>{if(selc.size)put([...selc],'inv',S.inv.length,null,true)};
/* arrastar e soltar */
let dr=null;
document.addEventListener('pointerdown',e=>{const g=e.target.closest('.grip');if(!g)return;e.preventDefault();const it=g.closest('.it'),cr=g.closest('.cr');let src,lb;
 if(it){src={t:'i',id:it.dataset.id};lb=find(src.id).it.n||'Item';it.classList.add('dg')}else{const k=+cr.dataset.k,ks=selc.has(k)?[...selc]:[k];src={t:'c',ks};lb=ks.length>1?ks.length+' itens':cl[k].n}
 const gh=document.createElement('div');gh.className='ghost';gh.textContent=lb;document.body.appendChild(gh);const ph=document.createElement('div');ph.className='ph';
 dr={src,gh,ph,g,l:null,idx:0};mv(e);g.setPointerCapture(e.pointerId);g.addEventListener('pointermove',mv);g.addEventListener('pointerup',up);g.addEventListener('pointercancel',up)});
function mv(e){const d=dr;d.gh.style.left=e.clientX+12+'px';d.gh.style.top=e.clientY+12+'px';const el=document.elementFromPoint(e.clientX,e.clientY),lst=el&&el.closest('.lst');d.ph.remove();document.querySelectorAll('.it.mg').forEach(x=>x.classList.remove('mg'));d.l=null;d.mg=null;if(!lst)return;
 d.l=lst.dataset.l;const rows=[...lst.querySelectorAll('.it:not(.dg)')];let idx=rows.length;const r=el.closest('.it'),c=d.src.t=='c'&&d.src.ks.length==1?cl[d.src.ks[0]]:null;
 if(r&&c&&r.dataset.key==c.c+c.n){const m=r.querySelector('.main').getBoundingClientRect();if(e.clientY<m.top+m.height*.65){d.mg=r.dataset.id;r.classList.add('mg');return}idx=rows.indexOf(r)+1}
 else for(let i=0;i<rows.length;i++){const b=rows[i].getBoundingClientRect();if(e.clientY<b.top+b.height/2){idx=i;break}}
 d.idx=idx;lst.insertBefore(d.ph,rows[idx]||null)}
function up(){const d=dr;dr=null;d.g.removeEventListener('pointermove',mv);d.g.removeEventListener('pointerup',up);d.g.removeEventListener('pointercancel',up);d.gh.remove();d.ph.remove();
 if(d.l&&d.src.t=='c')return put(d.src.ks,d.l,d.idx,d.mg);
 if(d.l){const f=find(d.src.id);if(f){if(d.l=='eq'&&need(f.it))toast('Equipe antes: '+f.it.ar);else{S[f.l].splice(f.i,1);S[d.l].splice(d.idx,0,f.it)}}}render();save()}
render();
</script></body></html>
